name: Renovate

# Runs Renovate as the Sora GitHub App across every repo the app is installed on
# (repos without a renovate config are skipped). Free: this repo is public.
# Hourly, so automerges and Dependency Dashboard checkboxes are picked up within
# the hour; each repo's `schedule` still decides when new PRs may open.
#
# Setup: see README.md (variable SORA_APP_CLIENT_ID, secret SORA_APP_PRIVATE_KEY).

on:
  schedule:
    - cron: "37 * * * *"
  push:
    branches: [main]
    paths:
      - "config.js"
      - "default.json"
      - "weekly.json"
      - ".github/workflows/renovate.yml"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        type: choice
        default: info
        options:
          - info
          - debug

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    # Don't run in forks, or before the app credentials exist.
    if: github.repository == 'ardzero/sora-renovate' && vars.SORA_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Sora app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.SORA_APP_CLIENT_ID }}
          private-key: ${{ secrets.SORA_APP_PRIVATE_KEY }}
          # Token for every repo the app is installed on, not just this one.
          owner: ${{ github.repository_owner }}

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: config.js
          renovate-version: 44.258.1
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
